<div class="log-card">
    <div class="log-header">
        <span class="log-title">Ereignisprotokoll</span>
        <span class="log-count">{{msg.payload.length}} Events</span>
    </div>
    <div class="log-container">
        <div class="log-entry" ng-repeat="event in msg.payload | orderBy:'-$index'">
            <div class="event-icon">
                <i class="fa fa-walking"></i>
            </div>
            <div class="event-details">
                <span class="event-name">Bewegung erkannt</span>
                <span class="event-time">{{event.time}}</span>
            </div>
            <div class="event-indicator"></div>
        </div>
        <div class="log-empty" ng-if="!msg.payload || msg.payload.length === 0">
            Keine Bewegungen registriert
        </div>
    </div>
</div>
