<div class="hum-widget" ng-class="getHumClass(msg.payload)">
    <div class="glass-overlay"></div>
    <div class="content">
        <span class="label">Luftfeuchtigkeit</span>
        <div class="hum-value">
            <span class="number">{{msg.payload | number:0}}</span><span class="unit">%</span>
        </div>
        <div class="status-indicator">
            <div class="pulse-dot"></div>
            <span class="status-text">{{getHumStatus(msg.payload)}}</span>
        </div>
    </div>
</div>

<style>

    .hum-widget {
        position: relative;
        overflow: hidden;
        border-radius: 18px;
        padding: 20px;
        color: white;
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        min-height: 120px;
        transition: background 0.8s ease;
        /*box-shadow: 0 4px 15px rgba(0,0,0,0.2);*/
    }

    .glass-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0) 100%);
        z-index: 1;
        pointer-events: none;
    }

    .content {
        position: relative;
        z-index: 2;
    }

    .label {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        opacity: 0.8;
    }

    .hum-value {
        display: flex;
        align-items: baseline;
        margin-bottom: 5px;
    }

    .number {
        font-size: 3.5rem;
        font-weight: 800;
        line-height: 1;
    }

    .unit {
        font-size: 1.5rem;
        margin-left: 5px;
        font-weight: 300;
    }

    /* Status & Animation */
    .status-indicator {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.9rem;
    }

    .pulse-dot {
        width: 8px;
        height: 8px;
        background-color: white;
        border-radius: 50%;
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0% {
            transform: scale(0.95);
            box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7);
        }
        70% {
            transform: scale(1);
            box-shadow: 0 0 0 10px rgba(255, 255, 255, 0);
        }
        100% {
            transform: scale(0.95);
            box-shadow: 0 0 0 0 rgba(255, 255, 255, 0);
        }
    }

    /* Luftfeuchtigkeits-Gradients */
    .hum-dry {
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    }

    /* Trocken (Rosa/Rot) */
    .hum-ideal {
        background: linear-gradient(135deg, #5ee7df 0%, #b490ca 100%);
    }

    /* Ideal (Türkis/Lila) */
    .hum-ok {
        background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
    }

    /* Okay (Grün/Blau) */
    .hum-wet {
        background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    }

    /* Nass (Hellblau) */
    .hum-verywet {
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    }

    /* Sehr Nass (Dunkelblau) */
</style>

<script>
    (function (scope) {
        scope.getHumClass = function (hum) {
            if (hum < 30) return 'hum-dry';
            if (hum >= 30 && hum <= 45) return 'hum-ok';
            if (hum > 45 && hum <= 60) return 'hum-ideal';
            if (hum > 60 && hum <= 75) return 'hum-wet';
            return 'hum-verywet';
        };

        scope.getHumStatus = function (hum) {
            if (hum < 30) return 'Zu Trocken';
            if (hum >= 30 && hum <= 45) return 'Leicht Trocken';
            if (hum > 45 && hum <= 60) return 'Optimal';
            if (hum > 60 && hum <= 75) return 'Feucht';
            return 'Sehr Nass / Schimmelgefahr';
        };
    })(scope);
</script>
