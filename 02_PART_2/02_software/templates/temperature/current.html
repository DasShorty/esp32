<div class="temp-widget" ng-class="getTempClass(msg.payload)">
    <div class="glass-overlay"></div>
    <div class="content">
        <span class="label">Temperatur</span>
        <div class="temp-value">
            <span class="number">{{msg.payload | number:1}}</span><span class="unit">°C</span>
        </div>
        <div class="status-indicator">
            <div class="pulse-dot"></div>
            <span class="status-text">{{getStatusText(msg.payload)}}</span>
        </div>
    </div>
</div>

<style>

    .temp-widget {
        position: relative;
        overflow: hidden;
        border-radius: 18px;
        padding: 20px;
        color: white;
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        min-height: 120px;
        transition: background 0.8s ease;
        /*box-shadow: 0 4px 15px rgba(0,0,0,0.2);*/
    }

    .glass-overlay {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 100%);
        z-index: 1;
    }

    .content {
        position: relative;
        z-index: 2;
    }

    .label {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        opacity: 0.8;
    }

    /* Große Temperaturanzeige */
    .temp-value {
        margin: 10px 0;
        display: flex;
        align-items: baseline;
    }

    .number {
        font-size: 3.5rem;
        font-weight: 800;
        line-height: 1;
    }

    .unit {
        font-size: 1.5rem;
        margin-left: 5px;
        font-weight: 300;
    }

    /* Status & Animation */
    .status-indicator {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.9rem;
    }

    .pulse-dot {
        width: 8px;
        height: 8px;
        background-color: white;
        border-radius: 50%;
        box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7);
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); }
        70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(255, 255, 255, 0); }
        100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
    }

    /* Dynamische Gradients je nach Klasse */
    .temp-cold { background: linear-gradient(135deg, #1bd5ed 0%, #15a2b8 100%); }
    .temp-normal { background: linear-gradient(135deg, #88f411 0%, #72cc0e 100%); }
    .temp-warm { background: linear-gradient(135deg, #d99f0e 0%, #b8860c 100%); }
    .temp-hot { background: linear-gradient(135deg, #d90e0e 0%, #a30a0a 100%); }

</style>

<script>
    (function(scope) {
        // Logik für die CSS-Klasse basierend auf der Temperatur
        scope.getTempClass = function(temp) {
            if (temp > 25) return 'temp-hot';
            if (temp > 20) return 'temp-warm';
            if (temp > 15) return 'temp-normal';
            return 'temp-cold';
        };

        // Optional: Dynamischer Text-Status
        scope.getStatusText = function(temp) {
            if (temp > 25) return 'Sehr warm';
            if (temp > 20) return 'Angenehm';
            if (temp > 15) return 'Kühl';
            return 'Kalt';
        };
    })(scope);
</script>
