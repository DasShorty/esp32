<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<div class="container">
    <div id="data-temp">23°C</div>
    <div id="data-visual-temp"></div>
</div>

<script>
    const dataTemp = document.getElementById('data-temp');
    const dataVisual = document.getElementById('data-visual-temp');

    const temperature = Number.parseInt(dataTemp.textContent);

    if (temperature > 25) {
        setColor('#d90e0e');
    } else if (temperature > 20) {
        setColor('#d99f0e');
    } else if (temperature > 15) {
        setColor('#88f411');
    } else {
        setColor('#1bd5ed');
    }

    function setColor(color) {
        dataVisual.style.backgroundColor = color;
    }
</script>

<style>
    .container {
        color: white;
        background-color: #2c3e50;
        border-radius: 8px;
        border: 1px solid black;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        padding: 1rem;
    }

    #data-visual-temp {
        height: 20px;
        width: 20px;
        background-color: gray;
    }
</style>

</body>
</html>
