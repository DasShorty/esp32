<style>
    .motion-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow-y: hidden;
    }

    .status-indicator-motion {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        transition: all 0.5s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 15px;
        border: 4px solid #333;
    }

    /* State: No Motion */
    .status-still {
        background-color: #2c3e50;
        box-shadow: 0 0 0px rgba(0, 0, 0, 0);
    }

    /* State: Motion Detected */
    .status-active {
        background-color: #e74c3c;
        box-shadow: 0 0 20px #e74c3c;
        animation: pulse-red 1.5s infinite;
    }

    .status-text {
        font-size: 1.2em;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    @keyframes pulse-red {
        0% {
            transform: scale(0.95);
            box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7);
        }

        70% {
            transform: scale(1);
            box-shadow: 0 0 0 15px rgba(231, 76, 60, 0);
        }

        100% {
            transform: scale(0.95);
            box-shadow: 0 0 0 0 rgba(231, 76, 60, 0);
        }
    }
</style>

<div class="motion-container">
    <div class="status-indicator-motion" ng-class="msg.payload ? 'status-active' : 'status-still'">
        <i class="fa fa-user-secret" style="font-size: 30px; color: white;"></i>
    </div>
    <div class="status-text" ng-style="{'color': msg.payload ? '#e74c3c' : '#bdc3c7'}">
        {{msg.payload ? 'Bewegung erkannt' : 'Keine Bewegung'}}
    </div>
</div>
